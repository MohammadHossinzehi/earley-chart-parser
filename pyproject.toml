[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "earley-chart-parser"
version = "1.0.0"
description = "General context-free parsing with Earley's algorithm and shared packed parse forests"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Mohammad Hossinzehi" }]

[project.scripts]
earley = "earley.__main__:main"

[tool.setuptools]
packages = ["earley"]
